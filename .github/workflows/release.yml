name: Release NovaMP

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 1. Create a draft release ──────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'NovaMP ${{ github.ref_name }}',
              body: [
                'Descarca installerul potrivit pentru sistemul tau de mai jos.',
                '',
                '**Windows** → `.msi` sau `.exe`',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return String(data.id);

  # ── 2. Build Windows, upload artifacts + latest.json ──────────────────────
  build:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true

  # ── 3. Publish the release ────────────────────────────────────────────────
  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Publish release
        run: gh release edit "$TAG" --draft=false --repo "$REPO"
