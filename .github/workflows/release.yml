name: Release NovaMP

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 1. Create a draft release ──────────────────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'NovaMP ${{ github.ref_name }}',
              body: [
                'Descarca installerul potrivit pentru sistemul tau de mai jos.',
                '',
                '**Windows** → `.msi` sau `.exe`',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return String(data.id);

  # ── 2. Build Windows ───────────────────────────────────────────────────────
  build:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # ── 3. Assemble latest.json, then publish ─────────────────────────────────
  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Generate latest.json
        run: |
          ASSETS=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate)

          get_id()  { echo "$ASSETS" | jq -r ".[] | select(.name | test(\"$1\")) | .id"                    | head -1; }
          get_url() { echo "$ASSETS" | jq -r ".[] | select(.name | test(\"$1\")) | .browser_download_url"  | head -1; }
          dl()      { local id="$1"; [ -n "$id" ] && gh api "repos/$REPO/releases/assets/$id" \
                        -H "Accept: application/octet-stream" || true; }

          export WIN_EXE_URL=$(get_url '_x64-setup\\.exe$')
          export WIN_SIG=$(dl "$(get_id '_x64-setup\\.exe\\.sig$')")
          export TAG

          python3 <<'EOF'
          import os, json
          from datetime import datetime, timezone

          tag     = os.environ['TAG']
          win_url = os.environ.get('WIN_EXE_URL', '').strip()
          win_sig = os.environ.get('WIN_SIG',     '').strip()

          platforms = {}
          if win_url and win_sig:
              platforms['windows-x86_64'] = {'signature': win_sig, 'url': win_url}

          payload = {
              'version':  tag,
              'notes':    '',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }

          print(json.dumps(payload, indent=2))

          with open('latest.json', 'w') as f:
              json.dump(payload, f, indent=2)
          EOF

      - name: Upload latest.json to release
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --repo "$REPO"
