name: Release NovaMP

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 1. Create a draft release so both build jobs have a single target ──
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}

    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.ref_name }}',
              name: 'NovaMP ${{ github.ref_name }}',
              body: [
                'Descarca installerul potrivit pentru sistemul tau de mai jos.',
                '',
                '**Windows** → `.msi` sau `.exe`',
                '**macOS** → `.dmg`',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return String(data.id);

  # ── 2. Build each platform in parallel, upload artifacts only ──
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # No includeUpdaterJson here — both jobs would race and overwrite each other.
          # latest.json is assembled in publish-release after both builds finish.
          args: ${{ matrix.args }}

  # ── 3. Assemble latest.json from uploaded .sig files, then publish ──
  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}

    steps:
      - name: Generate latest.json
        run: |
          # Fetch all assets uploaded by the two build jobs
          ASSETS=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate)

          # Helpers
          get_id()  { echo "$ASSETS" | jq -r ".[] | select(.name | test(\"$1\")) | .id"               | head -1; }
          get_url() { echo "$ASSETS" | jq -r ".[] | select(.name | test(\"$1\")) | .browser_download_url" | head -1; }
          dl()      { local id="$1"; [ -n "$id" ] && gh api "repos/$REPO/releases/assets/$id" \
                        -H "Accept: application/octet-stream" || true; }

          # Windows NSIS installer + signature
          export WIN_EXE_URL=$(get_url '_x64-setup\\.exe$')
          export WIN_SIG=$(dl "$(get_id '_x64-setup\\.exe\\.sig$')")

          # macOS universal app tarball + signature (used by the updater, not the .dmg)
          export MAC_TAR_URL=$(get_url '_universal\\.app\\.tar\\.gz$')
          export MAC_SIG=$(dl "$(get_id '_universal\\.app\\.tar\\.gz\\.sig$')")

          export TAG

          python3 <<'EOF'
          import os, json
          from datetime import datetime, timezone

          tag     = os.environ['TAG']
          win_url = os.environ.get('WIN_EXE_URL', '').strip()
          win_sig = os.environ.get('WIN_SIG',     '').strip()
          mac_url = os.environ.get('MAC_TAR_URL', '').strip()
          mac_sig = os.environ.get('MAC_SIG',     '').strip()

          platforms = {}

          if win_url and win_sig:
              platforms['windows-x86_64'] = {'signature': win_sig, 'url': win_url}

          if mac_url and mac_sig:
              # Universal binary serves both Intel and Apple Silicon
              entry = {'signature': mac_sig, 'url': mac_url}
              platforms['darwin-x86_64']  = entry
              platforms['darwin-aarch64'] = entry

          payload = {
              'version':  tag,
              'notes':    '',
              'pub_date': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }

          print(json.dumps(payload, indent=2))

          with open('latest.json', 'w') as f:
              json.dump(payload, f, indent=2)
          EOF

      - name: Upload latest.json to release
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Publish release
        run: gh release edit "$TAG" --draft=false --repo "$REPO"
